name: Build Grade Architect APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          # Explicitly install the problematic dependency first
          sudo apt install -y libunwind-dev
          # Install the rest with a fix-broken flag just in case
          sudo apt install -f -y \
            build-essential \
            git \
            python3 \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libsqlite3-dev \
            sqlite3 \
            libssl-dev \
            tk-dev \
            libgdbm-dev \
            libc6-dev \
            libbz2-dev \
            libffi-dev \
            unzip \
            zip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config
          pip3 install --user --upgrade buildozer Cython==0.29.33 pillow

      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          # Force buildozer to accept all Android SDK licenses automatically
          yes | buildozer -v android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GradeArchitect-Package
          path: bin/*.apk
